<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Adik</title>
<style>html,body{height:100%;margin:0;background:#3b78c9;color:#fff;font-family:Roboto,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div id="m">Memuat…</div>
<script>
(function(){
  var SRC='https://raw.githubusercontent.com/asirpamuncak-collab/Aplikasi-Bebas/main/www/app.html';
  var KEY='adik_app_html';
  function show(h){document.open();document.write(h);document.close();}
  function bundled(){
    fetch('app.html').then(function(r){return r.text();}).then(show)
      .catch(function(){document.getElementById('m').textContent='Gagal memuat aplikasi';});
  }
  function cached(){
    var c=null;try{c=localStorage.getItem(KEY);}catch(e){}
    if(c)show(c);else bundled();
  }
  var ctl=new AbortController();
  var t=setTimeout(function(){ctl.abort();},4000);
  fetch(SRC+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal})
    .then(function(r){if(!r.ok)throw 0;return r.text();})
    .then(function(h){
      clearTimeout(t);
      if(h.indexOf('</html>')<0)throw 0;
      try{localStorage.setItem(KEY,h);}catch(e){}
      show(h);
    })
    .catch(function(){clearTimeout(t);cached();});
})();
</script>
</body></html>
